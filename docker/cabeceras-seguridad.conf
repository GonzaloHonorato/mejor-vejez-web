# Cabeceras de seguridad comunes a todas las respuestas. nginx descarta los
# add_header heredados cuando una location define los suyos, así que cada
# location que agrega cabeceras incluye este archivo. Referrer-Policy queda
# fuera porque /restablecer-clave usa uno más estricto.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# El ingreso con Google usa signInWithPopup: same-origin-allow-popups conserva
# la comunicación con la ventana emergente de Firebase.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
