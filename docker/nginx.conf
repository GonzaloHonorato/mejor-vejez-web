server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck del contenedor: no depende de la API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # env.js e index.html cambian por despliegue/entorno: nunca en caché.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Archivos con hash del build de Angular: caché larga.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # restablecer-clave puede llegar con ?codigo= (compatibilidad) en la
    # query: defensa en profundidad para que ese código nunca quede en el
    # access log, aunque el link ya lo manda en el fragmento (`#codigo=`,
    # que el navegador nunca envía al servidor).
    # index.html se sirve desde esta misma location (no como último parámetro
    # de try_files, que haría un redirect interno y el log usaría la location
    # de destino). Repite los add_header porque definir uno anula los heredados.
    location = /restablecer-clave {
        access_log off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # SPA: cualquier ruta desconocida la resuelve el router de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
