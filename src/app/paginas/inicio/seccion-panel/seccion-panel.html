<section class="seccion-panel" [attr.aria-labelledby]="idTitulo()">
  <h3 #tituloRef [id]="idTitulo()" tabindex="-1" class="seccion-panel__titulo">{{ titulo() }}</h3>

  @switch (estado()) {
    @case ('cargando') {
      <div role="status">
        <span class="oculto">Cargando…</span>
        <div class="seccion-panel__esqueleto" aria-hidden="true">
          <span class="mv-esqueleto mv-esqueleto--bloque"></span>
          <span class="mv-esqueleto"></span>
        </div>
      </div>
    }
    @case ('error') {
      <div class="mv-aviso mv-aviso--error" role="alert">
        <p>No se pudo cargar esta sección.</p>
        <button type="button" class="mv-boton" (click)="alReintentar()">Reintentar</button>
      </div>
    }
    @case ('vacio') {
      <p class="seccion-panel__vacio" role="status">{{ mensajeVacio() }}</p>
    }
    @case ('datos') {
      <ng-content></ng-content>
    }
  }

  @if (desactualizada()) {
    <div class="mv-aviso mv-aviso--alerta" role="alert">
      <p>No se pudo actualizar.</p>
      <button type="button" class="mv-boton" (click)="alReintentar()">Reintentar</button>
    </div>
  }
</section>
