<div class="acciones-tarea">
  @if (error(); as mensaje) {
    <p class="mv-aviso mv-aviso--error" role="alert">{{ mensaje }}</p>
  }

  @if (accionPidiendoObservacion(); as accion) {
    <div class="mv-campo">
      <label class="mv-campo__etiqueta" [attr.for]="'observacion-' + tarea().idTarea">
        {{ etiquetaObservacion(accion) }}
      </label>
      <textarea
        [id]="'observacion-' + tarea().idTarea"
        class="mv-campo__control area"
        [formControl]="controlObservacion"
        [attr.maxlength]="largoMaximoObservacion(accion)"
        [attr.aria-invalid]="mensajeCampoObservacion(accion) ? true : null"
        [attr.aria-describedby]="
          mensajeCampoObservacion(accion) ? 'observacion-error-' + tarea().idTarea : null
        "
      ></textarea>
      @if (mensajeCampoObservacion(accion); as mensaje) {
        <p [id]="'observacion-error-' + tarea().idTarea" class="mv-campo__error" role="alert">
          {{ mensaje }}
        </p>
      }
      <div class="botones">
        <button type="button" class="mv-boton mv-boton--primario" [disabled]="enviando()" (click)="confirmar()">
          Confirmar
        </button>
        <button type="button" class="mv-boton" [disabled]="enviando()" (click)="volver()">Volver</button>
      </div>
    </div>
  } @else if (principal(); as accionPrincipal) {
    <app-boton-dividido
      [principal]="{ etiqueta: etiquetaAccion[accionPrincipal] }"
      [acciones]="menu()"
      [etiquetaPrincipal]="etiquetaAccion[accionPrincipal] + ': ' + descripcionTarea()"
      [etiquetaMenu]="ariaLabelMenu()"
      [deshabilitado]="enviando()"
      (principal)="elegir(accionPrincipal)"
      (accion)="elegirDelMenu($event)"
    />
  }
</div>
